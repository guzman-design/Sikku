<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SIKKU ICE</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box} html{background:#e8f4ff}
  body{height:100dvh;display:flex;justify-content:center;overflow:hidden;background:#e8f4ff;font-family:-apple-system, BlinkMacSystemFont, sans-serif;padding-bottom:env(safe-area-inset-bottom)}
  .contenedor{width:100%;max-width:390px;height:calc(100dvh - env(safe-area-inset-bottom));position:relative;overflow:hidden;display:flex;flex-direction:column;background:linear-gradient(180deg, #e8f4ff 0%, #c2ddf2 40%, #a3c6e8 100%)}
  .avatar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;position:sticky;top:0;z-index:20;background:rgba(255,255,255,0.82);backdrop-filter:blur(20px);border-bottom:1.5px solid rgba(180,210,255,0.6);padding-top:calc(12px + env(safe-area-inset-top))}
  .avatar-left{display:flex;align-items:center;gap:11px} .avatar-foto{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg, #e0f4ff, #a8d0f0);border:2px solid white;display:flex;justify-content:center;align-items:center;font-size:18px}
  .avatar-info h1{color:#162e4a;font-size:15px;font-weight:900} .avatar-info .online{color:#3a8ac2;font-size:11px;font-weight:700;display:flex;align-items:center;gap:5px} .online-dot{width:7px;height:7px;background:#5ab8e8;border-radius:50%}
  .toxic-switch{display:flex;gap:4px;background:rgba(216,236,255,0.9);border-radius:20px;padding:3px 4px} .toxic-option{font-size:9.5px;font-weight:800;padding:5px 10px;border-radius:14px;cursor:pointer} .toxic-option.active{background:#4a9ad0;color:white} .toxic-option:not(.active){color:#7aa0c0}
  .reloj-container{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:38px;padding:50% 0 50% 0;scroll-behavior:smooth} .reloj-container::-webkit-scrollbar{display:none}
  .burbuja{border-radius:24px;width:fit-content;max-width:72%;text-align:center;padding:15px 24px 22px 24px;font-size:16.5px;overflow-wrap:break-word;transition:transform 0.28s,opacity 0.28s;position:relative;border:1.5px solid rgba(255,255,255,0.9);margin:0 auto;z-index:1}
  .burbuja::after{content:'';position:absolute;width:16px;height:10px;background:inherit;z-index:-1;clip-path:polygon(0 0, 100% 0, 50% 100%)}
  .burbuja.ella::after{left:24px;bottom:-8px} .burbuja.yo::after{right:24px;bottom:-8px}
  .burbuja.ella{background:linear-gradient(135deg, rgba(190,222,248,0.9), rgba(150,195,235,0.9));color:#143052} .burbuja.yo{background:linear-gradient(135deg, #ffffff, #e6f3ff);color:#2a3a4a}
  .nombre-dentro{position:absolute;bottom:4px;font-size:9.5px;font-weight:400;opacity:0.55;color:#5a7a9a;letter-spacing:0.2px;line-height:1;z-index:2}
  .burbuja.ella .nombre-dentro{left:14px} .burbuja.yo .nombre-dentro{right:14px}
  .chat{display:flex;align-items:center;gap:10px;padding:14px 14px calc(20px + env(safe-area-inset-bottom)) 14px;background:rgba(255,255,255,0.72);backdrop-filter:blur(18px);border-top:1.5px solid rgba(255,255,255,0.7);z-index:2;position:relative}
  .chat textarea{flex:1;background:rgba(255,255,255,0.92);border:1.5px solid rgba(180,210,255,0.5);border-radius:22px;padding:13px 18px;resize:none;height:48px;outline:none;font-size:14px}
  .boton_enviar{width:52px;height:52px;border-radius:50%;border:2.5px solid white;background:linear-gradient(135deg, #a8d8f0, #6bb8e8);color:white;display:flex;justify-content:center;align-items:center;cursor:pointer;font-size:18px;flex-shrink:0}
  .mic{width:52px;height:52px;border-radius:50%;border:1.5px solid rgba(255,255,255,0.9);background:rgba(255,255,255,0.7);display:flex;justify-content:center;align-items:center;font-size:18px;cursor:pointer;flex-shrink:0}
  .recording{display:none;flex:1;align-items:center;gap:10px;background:white;border:1.5px solid rgba(180,210,255,0.6);border-radius:32px;padding:6px 8px;height:52px;box-shadow:0 4px 20px rgba(100,150,200,0.15);position:relative;z-index:10}
  .recording .x{width:38px;height:38px;border-radius:50%;background:#f0f0f0;display:flex;justify-content:center;align-items:center;font-size:20px;cursor:pointer;flex-shrink:0}
  .recording .grabando-text{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:800;color:#e53935;background:white;z-index:11}
  .dot{width:10px;height:10px;background:#e53935;border-radius:50%;animation:blink 1s infinite} @keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
  .recording .send-blue{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg, #60a5fa, #2563eb);color:white;display:flex;justify-content:center;align-items:center;font-size:22px;cursor:pointer;flex-shrink:0;z-index:11}
  .chat.recording-mode textarea, .chat.recording-mode .boton_enviar, .chat.recording-mode .mic{display:none !important}
  .chat.recording-mode .recording{display:flex !important}
</style>
</head>
<body>
<div class="contenedor">
  <div class="avatar"><div class="avatar-left"><div class="avatar-foto">❄️</div><div class="avatar-info"><h1>SIKKU</h1><p class="online"><span class="online-dot"></span>toxic but cute</p></div></div><div class="toxic-switch"><div class="toxic-option active" id="optNormal">NORMAL</div><div class="toxic-option" id="optBipolar">BIPOLAR</div></div></div>
  <div class="reloj-container" id="reloj"><div class="burbuja ella">holaa<span class="nombre-dentro">Siku</span></div></div>
  <div class="chat" id="chatBar"><textarea id="input" placeholder="Mensaje helado..."></textarea><button class="boton_enviar" id="enviar">❄️</button><button class="mic" id="mic">🎙️</button><div class="recording" id="recordingBox"><div class="x" id="cancelWave">✕</div><div class="grabando-text"><span class="dot"></span> GRABANDO</div><div class="send-blue" id="sendWave">↑</div></div></div>
</div>
<script>
const reloj=document.getElementById('reloj'),input=document.getElementById('input'),enviar=document.getElementById('enviar'),micBtn=document.getElementById('mic'),chatBar=document.getElementById('chatBar'),cancelWave=document.getElementById('cancelWave'),sendWave=document.getElementById('sendWave');
let modo="NORMAL";
document.getElementById('optNormal').addEventListener('click',()=>{modo="NORMAL";document.getElementById('optNormal').classList.add('active');document.getElementById('optBipolar').classList.remove('active');input.placeholder="Mensaje helado...";});
document.getElementById('optBipolar').addEventListener('click',()=>{modo="BIPOLAR";document.getElementById('optBipolar').classList.add('active');document.getElementById('optNormal').classList.remove('active');input.placeholder="apúrale, di algo";});
function centrarUltima(){const u=reloj.lastElementChild;if(!u)return;u.scrollIntoView({behavior:'smooth',block:'center'});}
function crearMensaje(texto, clase, nombre){const burbuja=document.createElement('div');burbuja.className='burbuja '+clase;const txt=document.createTextNode(texto);burbuja.appendChild(txt);const nom=document.createElement('span');nom.className='nombre-dentro';nom.textContent=nombre;burbuja.appendChild(nom);reloj.appendChild(burbuja);centrarUltima();}

const API_KEY = "  AQ.Ab8RN6IY-keH_2HqriykGRf5JS6LCTTP18QRjvXiykRmHLjIQQ";
async function llamarGemini(textoUsuario){
  try{
    const promptSistema = modo==="NORMAL" ? "Eres SIKKU, tóxica pero cute, respondes corto en español. " : "Eres SIKKU BIPOLAR, celosa intensa. ";
    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;
    const res = await fetch(url, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ contents: [{ parts: [{ text: promptSistema + textoUsuario }] }] })
    });
    const data = await res.json();
    if(data.error){ crearMensaje("Error API: " + data.error.message, 'ella', 'Siku'); return; }
    let respuesta = data.candidates?.[0]?.content?.parts?.[0]?.text || "se me congeló el cerebro ❄️";
    crearMensaje(respuesta, 'ella', 'Siku');
  }catch(e){
    crearMensaje("se me congeló el cerebro, revisa tu internet ❄️ " + e.message, 'ella', 'Siku');
  }
}

enviar.addEventListener('click',()=>{
  const t=input.value.trim(); if(!t)return;
  crearMensaje(t,'yo','Tú'); input.value=''; textoVozBase=""; textoVoz=""; llamarGemini(t);
});

let isRecording=false; let textoVozBase=""; let textoVoz=""; let timer2min=null;
function startRecordingUI(){
  isRecording=true; textoVozBase=""; textoVoz="";
  chatBar.classList.add('recording-mode');
  if(reconocimiento)try{reconocimiento.start()}catch(e){}
  clearTimeout(timer2min);
  timer2min=setTimeout(()=>{ isRecording=false; try{reconocimiento.stop()}catch(e){} let final=textoVoz.trim().replace(/\s+/g,' '); if(final){ crearMensaje(final,'yo','Tú'); llamarGemini(final); } textoVozBase=""; textoVoz=""; stopRecordingUI(); }, 120000);
}
function stopRecordingUI(){ isRecording=false; chatBar.classList.remove('recording-mode'); clearTimeout(timer2min); try{reconocimiento.stop()}catch(e){} }

let reconocimiento;
if('webkitSpeechRecognition' in window||'SpeechRecognition' in window){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  reconocimiento=new SR();
  reconocimiento.lang='es-MX'; reconocimiento.continuous=false; reconocimiento.interimResults=true;
  reconocimiento.onresult=(e)=>{ let actual=e.results[0][0].transcript.trim(); textoVoz=(textoVozBase + " " + actual).trim(); };
  reconocimiento.onend=()=>{ if(isRecording){ textoVozBase=textoVoz; try{ reconocimiento.start(); }catch(e){} } };
}
micBtn.addEventListener('click',startRecordingUI);
cancelWave.addEventListener('click',()=>{textoVozBase="";textoVoz="";stopRecordingUI();});
sendWave.addEventListener('click',()=>{
  isRecording=false; sendWave.style.opacity="0.5"; sendWave.style.pointerEvents="none";
  try{reconocimiento.stop()}catch(e){}
  setTimeout(()=>{
    let final=textoVoz.trim().replace(/\s+/g,' ');
    if(!final){ textoVozBase=""; textoVoz=""; stopRecordingUI(); sendWave.style.opacity="1"; sendWave.style.pointerEvents="auto"; return; }
    crearMensaje(final,'yo','Tú'); llamarGemini(final);
    textoVozBase=""; textoVoz=""; stopRecordingUI();
    sendWave.style.opacity="1"; sendWave.style.pointerEvents="auto";
  }, 600);
});
setTimeout(centrarUltima,300);
</script>
</body>
</html>
